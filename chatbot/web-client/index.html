<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>IFAB Web Chat</title>
    <!-- Inclusione delle librerie esterne con fallback locale -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <script>
        // Fallback per socket.io se il CDN fallisce
        if (typeof io === 'undefined') {
            document.write('<script src="/libs/socket.io.min.js"><\/script>');
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Fallback per marked.js se il CDN fallisce
        if (typeof marked === 'undefined') {
            document.write('<script src="/libs/marked.min.js"><\/script>');
        }
    </script>

    <link href="/css/variables.css" rel="stylesheet">
    <link href="/css/layout.css" rel="stylesheet">
    <link href="/css/header.css" rel="stylesheet">
    <link href="/css/buttons.css" rel="stylesheet">
    <link href="/css/messages.css" rel="stylesheet">
    <link href="/css/animations-audio.css" rel="stylesheet">
    <link href="/css/info-box.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <header>
        <div class="header-content">
            <img src="/favicon.ico" alt="Logo" class="header-icon">
            <h1>IFAB Web Chat</h1>
            <div class="header-buttons">
                <a class="about-us-button" href="javascript:void(0)" id="newChatButton" onclick="window.location.reload()">New Chat</a>
                <a class="about-us-button" href="/about">Chi siamo</a>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <div class="chat-container" id="chatContainer">
            <iframe  class="message-container" id="messageContainer" frameBorder="0"
            src="http://localhost:8080">
            </iframe>

        </div>

        <div class="buttons-container">
            <div class="right-box">
                <div class="right-box-title">Zone di lavoro</div>
                <!-- Pulsanti statici in alto -->
                <!-- STATIC_BUTTONS_JOB_STATION -->
            </div>
            
            <div class="right-box">
                <div class="right-box-title">Macchinari</div>
                <!-- Pulsanti statici in basso -->
                <!-- STATIC_BUTTONS_MACHINE -->
            </div>
        </div>
    </div>
</div>

<!-- Info box -->  
<div class="info-box">
    <div class="info-box-content">⚠️Il contenuto generato dall'IA potrebbe essere errato⚠️</div>
</div>

<script src="/js/script.js"></script>
</body>
</html>
